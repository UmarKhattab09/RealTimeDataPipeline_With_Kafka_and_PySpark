#https://github.com/skylvr1289/sample_kafka
services:
# Zookeeper, single node
  zookeeper:
    image: wurstmeister/zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
      - 2888:2888
      - 3888:3888

 # kafka single node     
  kafka1:
    image: wurstmeister/kafka:latest
    restart: "no"
    links:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Consumer groups store their position in an internal topic; its default of 3 copies needs 3 brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      #https://github.com/wurstmeister/kafka-docker/issues/553

 # kafka single node     
  kafka2:
    image: wurstmeister/kafka:latest
    restart: "no"
    links:
      - zookeeper
    ports:
      - 9093:9093
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:29093,EXTERNAL://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Consumer groups store their position in an internal topic; its default of 3 copies needs 3 brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      #https://github.com/wurstmeister/kafka-docker/issues/553

#kafdrop for topic/msg visualization
  kafdrop:
    image: obsidiandynamics/kafdrop
    restart: "no"
    environment:
      KAFKA_BROKERCONNECT: "kafka1:29092,kafka2:29093"
      # JVM_OPTS: "-Xms16M -Xmx512M -Xss180K -XX:-TieredCompilation -XX:+UseStringDeduplication -noverify"
    ports:
      - 9000:9000
    depends_on:
      - kafka1
      - kafka2

  # --- The "website": producer + the small programs that react to events -------------
  # They run all the time, so they are plain services, not Airflow tasks.
  producer:
    build: ./services
    command: python producer.py
    restart: on-failure
    environment: &kafka-env
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29093
    depends_on: [kafka1, kafka2]

  notification-service:   # user_signed_in -> sign-in alert
    build: ./services
    command: python notification_service.py
    restart: on-failure
    environment: *kafka-env
    depends_on: [kafka1, kafka2]

  email-service:          # order_placed -> confirmation email
    build: ./services
    command: python email_service.py
    restart: on-failure
    environment: *kafka-env
    depends_on: [kafka1, kafka2]

  fulfillment-service:    # payment_completed -> ship order or ask for retry
    build: ./services
    command: python fulfillment_service.py
    restart: on-failure
    environment: *kafka-env
    depends_on: [kafka1, kafka2]

  # --- Analytics database: Spark writes the raw and analytics tables here ----------
  # From your machine: psql -h localhost -p 5433 -U warehouse warehouse  (password: warehouse)
  warehouse:
    image: postgres:15
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse"]
      interval: 5s
      retries: 10

  # --- Airflow and its own metadata database --------------------------------------
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # Airflow with Java + PySpark baked in (see Dockerfile). UI: http://localhost:8080 (admin / admin)
  airflow:
    build: .
    restart: always
    # On Linux, put AIRFLOW_UID=$(id -u) in a .env file so the container can write to ./data and ./airflow/logs
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      # Inside the compose network the brokers are reached by service name, not localhost
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29093
      PIPELINE_DATA_DIR: /opt/airflow/data
      WAREHOUSE_JDBC_URL: jdbc:postgresql://warehouse:5432/warehouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/scripts:/opt/airflow/scripts
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create --username admin --password admin --firstname Umar --lastname Khattab --role Admin --email admin@example.com || true) &&
      exec airflow standalone
      "
    depends_on:
      postgres:
        condition: service_healthy
      warehouse:
        condition: service_healthy
      kafka1:
        condition: service_started
      kafka2:
        condition: service_started

volumes:
  warehouse_data:
